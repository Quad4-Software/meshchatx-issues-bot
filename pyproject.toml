[project]
name = "meshchatx-issues-bot"
version = "0.1.0"
description = "LXMF issues bot for Reticulum with admin notifications"
license = "0BSD"
requires-python = ">=3.12"
dependencies = [
    "lxmfy>=2.0.1",
    "python-dotenv>=1.2.2",
    "rns>=1.5.2",
]

[project.scripts]
meshchatx-issues-bot = "meshchatx_issues_bot.bot:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshchatx_issues_bot"]
